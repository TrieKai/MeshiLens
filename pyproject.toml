[project]
name = "meshilens"
version = "0.5.50"
description = "Show Tabelog ratings and Michelin Guide Japan distinctions in Google Maps"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "curl-cffi>=0.7,<1",
  "gurume>=0.0.12,<0.1",
  "lxml>=5,<7",
]

[project.optional-dependencies]
redis = ["redis>=5,<6"]

[project.scripts]
meshilens-server = "meshi_lens.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meshi_lens"]
artifacts = ["src/meshi_lens/data/*.json"]
