name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run Python tests
        env:
          PYTHONPATH: src
        run: uv run python -m unittest discover -s tests -v

      - name: Check extension syntax
        run: |
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js

      - name: Run extension tests
        run: node --test tests/test_*.js

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Caches Gradle and validates the committed wrapper jar.
      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships the Android SDK and sets ANDROID_HOME.
      - name: Run Android unit tests and build the debug APK
        run: ./gradlew testDebugUnitTest assembleDebug
